name: "🐳 CI/CD Pipeline for Portfolio API"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  ECR_REPOSITORY: portfolio-api
  LAMBDA_FUNCTION_NAME: portfolio-api
  KNOWLEDGE_REFRESH_FUNCTION_NAME: portfolio-knowledge-refresh
  # Configure this non-secret repository variable in GitHub Settings > Variables.
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}

jobs:
  changes:
    name: "🔎 Detect changed paths"
    runs-on: ubuntu-24.04
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            migrations:
              - 'migrations/**'

  migration_check:
    name: "🗃️ Validate migrations"
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portfolio_ci
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio_ci
    steps:
      - name: "🔄 Checkout repository"
        uses: actions/checkout@v5

      - name: "🗃️ Apply schema to disposable PostgreSQL"
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/mock_data.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT to_regclass('grant_schema.grants'), to_regclass('portfolio_schema.knowledge_documents');"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) = 6 AS mock_grants_seeded FROM grant_schema.grants;"

  pip_audit:
    name: "🐍 pip-audit (Python Dependency Vulnerability Scan)"
    runs-on: ubuntu-24.04
    steps:
      - name: "🔄 Checkout repository"
        uses: actions/checkout@v5

      - name: "🦾 Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: "📦 Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "🔍 pip-audit: Scan for vulnerable dependencies"
        run: |
          pip install pip-audit
          pip-audit

  build:
    name: "🐳 Build & Push Image"
    runs-on: ubuntu-24.04
    needs: pip_audit
    steps:
      - name: "🔄 Checkout repository"
        uses: actions/checkout@v5

      - name: "🔐 Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: "🔓 Login to ECR"
        uses: aws-actions/amazon-ecr-login@v2

      - name: "🐳 Build & Push Docker image"
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f Dockerfile.lambda \
            -t ${{ secrets.IMAGE_URI }} \
            .
          docker push ${{ secrets.IMAGE_URI }}

      - name: "🧹 Cleanup all untagged images in ECR"
        run: |
          REPO_NAME=${{ env.ECR_REPOSITORY }}
          REGION=${{ secrets.AWS_REGION }}
          IMAGE_IDS=$(aws ecr list-images \
            --repository-name "$REPO_NAME" \
            --region "$REGION" \
            --filter tagStatus=UNTAGGED \
            --query 'imageIds' \
            --output json)
          if [ "$IMAGE_IDS" != "[]" ]; then
            echo "Deleting untagged images..."
            aws ecr batch-delete-image \
              --repository-name "$REPO_NAME" \
              --region "$REGION" \
              --image-ids "$IMAGE_IDS"
          else
            echo "No untagged images found."
          fi

  scan:
    name: "🔍 Scan Image with Trivy"
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: "🔐 Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: "🔓 Login to ECR"
        uses: aws-actions/amazon-ecr-login@v2

      - name: "🛡️ Scan image"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.IMAGE_URI }}
          severity: CRITICAL
          exit-code: '1'

  migrate:
    name: "🗃️ Apply production migrations"
    runs-on: ubuntu-24.04
    needs: [changes, migration_check, scan]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.migrations == 'true' &&
      needs.migration_check.result == 'success' &&
      needs.scan.result == 'success'
    env:
      # Reuse the application's production connection string. The step below
      # converts SQLAlchemy's asyncpg driver URL into psql's standard URL.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: "🔄 Checkout repository"
        uses: actions/checkout@v5

      - name: "🗃️ Apply schema and mock data to Neon"
        run: |
          MIGRATION_DATABASE_URL=$(printf '%s' "$DATABASE_URL" | sed 's#^postgresql+asyncpg:#postgresql:#')
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/schema.sql
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/mock_data.sql

  deploy:
    name: "🚀 Deploy to Lambda"
    runs-on: ubuntu-24.04
    needs: [scan, migrate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.scan.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    steps:
      - name: "🔐 Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: "🚀 Update Lambda function"
        run: |
          ENVIRONMENT_FILE=$(mktemp)
          trap 'rm -f "$ENVIRONMENT_FILE"' EXIT
          FUNCTIONS="${{ env.LAMBDA_FUNCTION_NAME }}"
          if aws lambda get-function \
            --function-name "${{ env.KNOWLEDGE_REFRESH_FUNCTION_NAME }}" >/dev/null 2>&1; then
            FUNCTIONS="$FUNCTIONS ${{ env.KNOWLEDGE_REFRESH_FUNCTION_NAME }}"
          else
            echo "Knowledge refresh Lambda is not provisioned yet; Terraform will create it."
          fi

          for FUNCTION_NAME in $FUNCTIONS; do
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --image-uri ${{ secrets.IMAGE_URI }} >/dev/null
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"

            CURRENT_ENV=$(aws lambda get-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --query 'Environment.Variables' \
              --output json)
            jq -c --arg model "$OPENAI_MODEL" \
              '{Variables: ((. // {}) + {OPENAI_MODEL: $model})}' \
              <<< "$CURRENT_ENV" > "$ENVIRONMENT_FILE"
            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --environment "file://$ENVIRONMENT_FILE" >/dev/null
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          done
